<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Maps Scraper</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --card: #1a1d27;
      --card2: #22263a;
      --border: #2a2f45;
      --accent: #4f8ef7;
      --accent2: #7c5cfc;
      --green: #22c55e;
      --red: #ef4444;
      --text: #e2e8f0;
      --muted: #8892a4;
      --radius: 14px;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 32px 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
    }
    .header h1 {
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .header p { color: var(--muted); margin-top: 8px; font-size: 15px; }

    .main-card {
      max-width: 780px;
      margin: 0 auto 40px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
    }

    label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 8px; letter-spacing: .5px; }

    .url-row { display: flex; gap: 12px; align-items: stretch; }

    input[type="text"] {
      flex: 1;
      background: var(--card2);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 14px;
      padding: 12px 16px;
      outline: none;
      transition: border-color .2s;
      font-family: inherit;
    }
    input[type="text"]::placeholder { color: var(--muted); }
    input[type="text"]:focus { border-color: var(--accent); }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .2s, transform .1s;
      font-family: inherit;
      white-space: nowrap;
    }
    .btn:active { transform: scale(.97); }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
    }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; transform: none; }
    .btn-clear {
      background: var(--card2);
      border: 1.5px solid var(--border);
      color: var(--muted);
    }
    .btn-clear:hover { border-color: var(--red); color: var(--red); }

    .options-row {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-top: 16px;
      flex-wrap: wrap;
    }
    .options-row label { margin: 0; color: var(--muted); font-size: 13px; }
    .options-row input[type="number"] {
      width: 80px;
      padding: 8px 12px;
      background: var(--card2);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      outline: none;
    }
    .options-row input[type="number"]:focus { border-color: var(--accent); }

    /* Status bar */
    #status-bar {
      display: none;
      align-items: center;
      gap: 12px;
      margin-top: 20px;
      padding: 14px 18px;
      background: var(--card2);
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    #status-bar.active { display: flex; }
    .spinner {
      width: 20px; height: 20px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #status-text { font-size: 14px; color: var(--text); }
    #elapsed { margin-left: auto; font-size: 12px; color: var(--muted); }

    /* Results area */
    #results { max-width: 1200px; margin: 0 auto; }

    .result-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 30px;
      animation: fadeUp .3s ease both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .place-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: flex-start;
      gap: 16px;
      flex-wrap: wrap;
    }
    .place-info { flex: 1; min-width: 200px; }
    .place-name { font-size: 20px; font-weight: 700; color: var(--text); }
    .place-meta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 100px;
      font-size: 12px;
      font-weight: 500;
    }
    .badge-green { background: rgba(34,197,94,.15); color: var(--green); }
    .badge-blue  { background: rgba(79,142,247,.15); color: var(--accent); }
    .badge-grey  { background: var(--card2); color: var(--muted); }

    .img-count {
      font-size: 14px;
      font-weight: 600;
      color: var(--accent);
      margin-left: auto;
      white-space: nowrap;
      align-self: center;
    }

    /* Photo grid */
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 4px;
      padding: 4px;
    }
    .photo-grid img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      cursor: zoom-in;
      transition: transform .2s, filter .2s;
      border-radius: 4px;
    }
    .photo-grid img:hover { transform: scale(1.03); filter: brightness(1.1); }
    .photo-grid img.error { display: none; }

    .no-images {
      padding: 40px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }
    .empty-state .icon { font-size: 64px; margin-bottom: 16px; opacity: .4; }
    .empty-state p { font-size: 16px; }

    /* Lightbox */
    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.92);
      z-index: 9999;
      justify-content: center;
      align-items: center;
    }
    #lightbox.open { display: flex; }
    #lightbox img {
      max-width: 92vw;
      max-height: 88vh;
      border-radius: 10px;
      box-shadow: 0 24px 80px rgba(0,0,0,.8);
    }
    .lb-close {
      position: absolute;
      top: 20px; right: 28px;
      color: #fff;
      font-size: 36px;
      cursor: pointer;
      opacity: .7;
      transition: opacity .2s;
    }
    .lb-close:hover { opacity: 1; }
    .lb-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,.12);
      color: #fff;
      border: none;
      font-size: 28px;
      padding: 14px 18px;
      border-radius: 8px;
      cursor: pointer;
      transition: background .2s;
    }
    .lb-nav:hover { background: rgba(255,255,255,.25); }
    .lb-prev { left: 20px; }
    .lb-next { right: 20px; }
    .lb-counter {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,.7);
      font-size: 13px;
    }

    /* History */
    #history-section { max-width: 780px; margin: 0 auto 30px; }
    #history-section h3 { font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 12px; }
    .history-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .history-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 12px;
      color: var(--muted);
      cursor: pointer;
      transition: border-color .2s, color .2s;
      max-width: 300px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .history-item:hover { border-color: var(--accent); color: var(--text); }

    /* Error state */
    .error-box {
      background: rgba(239,68,68,.1);
      border: 1px solid rgba(239,68,68,.3);
      border-radius: 10px;
      padding: 16px 20px;
      color: var(--red);
      font-size: 14px;
      margin-top: 16px;
    }
  </style>
</head>
<body>

<div class="header">
  <h1>🗺️ Google Maps Scraper</h1>
  <p>Paste a Google Maps place URL to instantly extract all photos</p>
</div>

<div class="main-card">
  <label>GOOGLE MAPS PLACE URL</label>
  <div class="url-row">
    <input type="text" id="urlInput"
      placeholder="https://www.google.com/maps/place/..." />
    <button class="btn btn-primary" id="scrapeBtn" onclick="startScrape()">
      ⚡ Scrape
    </button>
    <button class="btn btn-clear" onclick="clearAll()">✕ Clear</button>
  </div>

  <div class="options-row">
    <label>Max images:</label>
    <input type="number" id="maxImages" value="30" min="1" max="100">
    <span id="error-inline" style="color: var(--red); font-size: 13px; display:none;"></span>
  </div>

  <div id="status-bar">
    <div class="spinner" id="spinner"></div>
    <span id="status-text">Opening browser...</span>
    <span id="elapsed">0s</span>
  </div>
</div>

<div id="history-section" style="display:none">
  <h3>📋 RECENT SCRAPES</h3>
  <div class="history-list" id="history-list"></div>
</div>

<div id="results">
  <div class="empty-state" id="empty-state">
    <div class="icon">📷</div>
    <p>Paste a Google Maps URL above and click Scrape</p>
  </div>
</div>

<!-- Lightbox -->
<div id="lightbox">
  <span class="lb-close" onclick="closeLb()">✕</span>
  <button class="lb-nav lb-prev" onclick="lbNav(-1)">‹</button>
  <img id="lb-img" src="" alt="">
  <button class="lb-nav lb-next" onclick="lbNav(1)">›</button>
  <div class="lb-counter" id="lb-counter"></div>
</div>

<script>
  let lbImages = [];
  let lbIdx = 0;
  let elapsedTimer = null;
  let elapsedSec = 0;
  let scrapeHistory = JSON.parse(localStorage.getItem('scrapeHistory') || '[]');

  // ---- History ----
  function renderHistory() {
    if (!scrapeHistory.length) {
      document.getElementById('history-section').style.display = 'none';
      return;
    }
    document.getElementById('history-section').style.display = 'block';
    const list = document.getElementById('history-list');
    list.innerHTML = scrapeHistory.slice(-8).reverse().map(h => `
      <div class="history-item" onclick="loadHistory('${escHtml(h.url)}')" title="${escHtml(h.url)}">
        ${escHtml(h.name || h.url.replace('https://www.google.com/maps/place/', ''))}
      </div>
    `).join('');
  }

  function loadHistory(url) {
    document.getElementById('urlInput').value = url;
    startScrape();
  }

  function addHistory(url, name) {
    scrapeHistory = scrapeHistory.filter(h => h.url !== url);
    scrapeHistory.push({ url, name });
    if (scrapeHistory.length > 20) scrapeHistory.shift();
    localStorage.setItem('scrapeHistory', JSON.stringify(scrapeHistory));
    renderHistory();
  }

  // ---- Scrape ----
  async function startScrape() {
    const url = document.getElementById('urlInput').value.trim();
    const maxImages = parseInt(document.getElementById('maxImages').value) || 30;
    const errEl = document.getElementById('error-inline');

    errEl.style.display = 'none';

    if (!url) {
      errEl.textContent = 'Please enter a URL';
      errEl.style.display = 'inline';
      return;
    }
    if (!url.includes('google.com/maps')) {
      errEl.textContent = 'Must be a Google Maps URL';
      errEl.style.display = 'inline';
      return;
    }

    setLoading(true);

    try {
      const resp = await fetch('/api/v1/simple-scrape', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url, max_images: maxImages })
      });

      if (!resp.ok) throw new Error(`Server error: ${resp.status}`);
      const data = await resp.json();

      setLoading(false);
      renderResult(data, url);
      addHistory(url, data.place_name);

    } catch (err) {
      setLoading(false);
      showError(err.message);
    }
  }

  function setLoading(on) {
    const btn = document.getElementById('scrapeBtn');
    const bar = document.getElementById('status-bar');

    if (on) {
      btn.disabled = true;
      btn.textContent = '⏳ Scraping...';
      bar.classList.add('active');
      elapsedSec = 0;
      document.getElementById('elapsed').textContent = '0s';
      clearInterval(elapsedTimer);
      elapsedTimer = setInterval(() => {
        elapsedSec++;
        document.getElementById('elapsed').textContent = elapsedSec + 's';
        const msgs = ['Opening browser...', 'Navigating to place...', 'Loading place details...', 'Opening photo gallery...', 'Scrolling gallery...', 'Extracting images...', 'Almost done...'];
        const idx = Math.min(Math.floor(elapsedSec / 5), msgs.length - 1);
        document.getElementById('status-text').textContent = msgs[idx];
      }, 1000);
    } else {
      btn.disabled = false;
      btn.innerHTML = '⚡ Scrape';
      bar.classList.remove('active');
      clearInterval(elapsedTimer);
    }
  }

  function showError(msg) {
    document.getElementById('results').innerHTML = `
      <div class="error-box">❌ Scrape failed: ${escHtml(msg)}</div>
    `;
  }

  function clearAll() {
    document.getElementById('urlInput').value = '';
    document.getElementById('results').innerHTML = `
      <div class="empty-state" id="empty-state">
        <div class="icon">📷</div>
        <p>Paste a Google Maps URL above and click Scrape</p>
      </div>
    `;
    lbImages = [];
  }

  function renderResult(data, url) {
    const imgs = data.image_urls || [];
    const isSuccess = data.status === 'success';

    document.getElementById('empty-state')?.remove();

    const card = document.createElement('div');
    card.className = 'result-card';
    card.innerHTML = `
      <div class="place-header">
        <div class="place-info">
          <div class="place-name">${escHtml(data.place_name)}</div>
          <div class="place-meta">
            ${data.rating ? `<span class="badge badge-green">⭐ ${escHtml(data.rating)}</span>` : ''}
            ${data.phone ? `<span class="badge badge-blue">📞 ${escHtml(data.phone)}</span>` : ''}
            ${data.address ? `<span class="badge badge-grey">📍 ${escHtml(data.address)}</span>` : ''}
            <span class="badge ${isSuccess ? 'badge-green' : 'badge-grey'}">${isSuccess ? '✅ Success' : '⚠️ No images'}</span>
          </div>
        </div>
        <div class="img-count">📸 ${imgs.length} photos</div>
      </div>
      <div class="photo-grid" id="grid-${Date.now()}">
        ${imgs.length === 0
          ? '<div class="no-images">No images found for this place</div>'
          : imgs.map((img, i) => `
            <img src="${escAttr(img)}" referrerpolicy="no-referrer"
              alt="Photo ${i+1}"
              data-src="${escAttr(img)}"
              onerror="this.classList.add('error')"
              onclick="openLb(${i}, event.currentTarget.closest('.result-card'))"
            >`).join('')
        }
      </div>
    `;

    document.getElementById('results').prepend(card);
  }

  // ---- Lightbox ----
  function openLb(startIdx, card) {
    const imgs = Array.from(card.querySelectorAll('.photo-grid img:not(.error)'))
      .map(el => el.getAttribute('data-src'));
    if (!imgs.length) return;
    lbImages = imgs;
    lbIdx = startIdx;
    updateLb();
    document.getElementById('lightbox').classList.add('open');
  }

  function closeLb() {
    document.getElementById('lightbox').classList.remove('open');
  }

  function lbNav(dir) {
    lbIdx = (lbIdx + dir + lbImages.length) % lbImages.length;
    updateLb();
  }

  function updateLb() {
    document.getElementById('lb-img').src = lbImages[lbIdx];
    document.getElementById('lb-counter').textContent = `${lbIdx + 1} / ${lbImages.length}`;
  }

  document.addEventListener('keydown', e => {
    if (!document.getElementById('lightbox').classList.contains('open')) return;
    if (e.key === 'Escape') closeLb();
    if (e.key === 'ArrowRight') lbNav(1);
    if (e.key === 'ArrowLeft') lbNav(-1);
  });

  document.getElementById('lightbox').addEventListener('click', e => {
    if (e.target === document.getElementById('lightbox')) closeLb();
  });

  // Allow pressing Enter to scrape
  document.getElementById('urlInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') startScrape();
  });

  // ---- Helpers ----
  function escHtml(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function escAttr(s) {
    return String(s || '').replace(/"/g, '&quot;');
  }

  renderHistory();
</script>
</body>
</html>
